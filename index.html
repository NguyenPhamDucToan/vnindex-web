<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VNIndex — Định giá cổ phiếu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">VN<span>INDEX</span></div>
    <div class="picker-wrap">
      <input id="picker" placeholder="Tìm mã / tên…" autocomplete="off" spellcheck="false" />
      <div id="picker-list" class="hidden"></div>
    </div>
    <nav id="nav"></nav>
    <div id="meta" class="meta"></div>
  </aside>
  <main class="main">
    <section id="view-stock" class="view"></section>
    <section id="view-screen" class="view hidden"></section>
    <section id="view-sector" class="view hidden"></section>
    <section id="view-portfolio" class="view hidden"></section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
