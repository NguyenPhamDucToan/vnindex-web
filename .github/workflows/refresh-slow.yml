name: Weekly refresh of the slow side-loaded data

# deploy.yml rebuilds the fast-moving files every weekday, but four blocks come
# from throttled VCI/Yahoo calls that take far too long for a daily job:
#
#   detail + news_events   ~80 min   (20 quarters of income/balance per ticker)
#   holders                ~40 min   (shareholders + officers per ticker)
#   commodities             ~1 min   (14 Yahoo futures series)
#
# They also change slowly -- a shareholder register or a quarter's detail moves
# once a quarter at most -- so weekly is the right cadence. Unlike deploy.yml
# these DO commit, because export_data.py carries them forward from the
# committed data/ on every later run; if they lived only in an artifact they
# would be lost on the next daily deploy.
on:
  schedule:
    # 12:00 UTC Sunday = 19:00 ICT Sunday, deliberately AFTER the sibling
    # repo's financials sweep (Sunday 05:00 UTC, up to 350 minutes). It used to
    # run Saturday 18:00, i.e. before that sweep, so `detail` was always up to a
    # week behind `financials`. quarterly.js indexes detail by the quarters
    # financials provides, so during that week the detail-fed charts stopped one
    # quarter short of the charts beside them. Running last keeps them level.
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      field:
        description: "Which block to backfill (detail field or top-level key)"
        default: "holders"
        type: choice
        options: [holders, payables, fvtpl, all]

concurrency:
  group: slow-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # backfill.py restarts export_detailed.py until nothing is left, and the
    # VCI Guest tier throttles with SystemExit and 57s penalties, so a healthy
    # full sweep is well over an hour.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          path: vnindex-web

      - uses: actions/checkout@v5
        with:
          repository: NguyenPhamDucToan/vnindex_valuation
          path: vnindex-valuation

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # vnstock left PyPI for its own index in late September (see deploy.yml).
      # Unlike the deploy, this job IS vnstock -- every block it backfills comes
      # from VCI through it -- so here a failed install should fail the job.
      - name: Install dependencies
        env:
          VNSTOCK_TELEMETRY: "0"
        run: |
          pip install -r vnindex-web/requirements.txt
          grep -viE '^\s*vnstock' vnindex-valuation/requirements.txt > /tmp/valuation-req.txt
          pip install -r /tmp/valuation-req.txt
          pip install --extra-index-url https://vnstocks.com/api/packages "vnstock>=5,<6"

      # vnstock 5.1+ refuses the guest tier on GitHub Actions, and a key alone
      # is not enough: the runner has to be registered as a device, which
      # login() does. It persists for the later steps of this job.
      - name: Log in to vnstock
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python -c "import os, vnstock; print('vnstock tier:', vnstock.login(os.environ['VNSTOCK_API_KEY'])['tier'])"

      - name: Commodity prices
        working-directory: vnindex-web
        env:
          PYTHONIOENCODING: utf-8
          # vnstock 5.1+ refuses the guest tier on GitHub Actions.
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        # Cheap and independent of the DB, so it runs first and is never the
        # thing a long throttled sweep runs out of time before reaching.
        run: python export_commodities.py

      - name: Backfill the throttled blocks
        working-directory: vnindex-web
        env:
          PYTHONIOENCODING: utf-8
          # vnstock 5.1+ refuses the guest tier on GitHub Actions.
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        # backfill.py stops on its own when a round makes no progress, so a
        # field the source genuinely has no data for does not spin the job.
        run: |
          FIELD='${{ inputs.field }}'
          if [ -z "$FIELD" ] || [ "$FIELD" = "all" ]; then
            python backfill.py holders
            python backfill.py payables
          else
            python backfill.py "$FIELD"
          fi

      - name: Commit whatever changed
        working-directory: vnindex-web
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Weekly refresh of side-loaded data"
            git push
          fi
