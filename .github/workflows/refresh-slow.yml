name: Weekly refresh of the slow side-loaded data

# deploy.yml rebuilds the fast-moving files every weekday, but these blocks come
# from per-ticker VCI/Yahoo calls that are too many for a daily job:
#
#   detail + news_events + holders  ~30 min   (one export_detailed.py --all sweep;
#                                              was 2h+ under vnstock's quota)
#   analyst                         ~25 min   (export_analyst.py --all, 3s apart)
#   commodities                      ~1 min   (14 Yahoo futures series)
#
# They also change slowly -- a shareholder register or a quarter's detail moves
# once a quarter at most -- so weekly is the right cadence. Unlike deploy.yml
# these DO commit, because export_data.py carries them forward from the
# committed data/ on every later run; if they lived only in an artifact they
# would be lost on the next daily deploy.
on:
  schedule:
    # 12:00 UTC Sunday = 19:00 ICT Sunday, deliberately AFTER the sibling
    # repo's financials sweep (Sunday 05:00 UTC; the step "Wait for the
    # sibling's financials refresh" covers GitHub starting it late). It used to
    # run Saturday 18:00, i.e. before that sweep, so `detail` was always up to a
    # week behind `financials`. quarterly.js indexes detail by the quarters
    # financials provides, so during that week the detail-fed charts stopped one
    # quarter short of the charts beside them. Running last keeps them level.
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      field:
        description: "refresh = refetch every ticker; or a field to backfill where missing"
        default: "refresh"
        type: choice
        options: [refresh, holders, payables, fvtpl]

concurrency:
  group: slow-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # Up to 2h waiting for the financials refresh, ~30 min of sweep, and room
    # for a slow day at VCI.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          path: vnindex-web

      - uses: actions/checkout@v5
        with:
          repository: NguyenPhamDucToan/vnindex_valuation
          path: vnindex-valuation

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # Every block this job backfills comes from VCI through the sibling's
      # vndata package (plain requests), so no vnstock, API key or login.
      - name: Install dependencies
        run: |
          pip install -r vnindex-web/requirements.txt
          pip install -r vnindex-valuation/requirements.txt

      - name: Commodity prices
        working-directory: vnindex-web
        env:
          PYTHONIOENCODING: utf-8
        # Cheap and independent of the DB, so it runs first and is never the
        # thing a long throttled sweep runs out of time before reaching.
        run: python export_commodities.py

      # The detail block indexes the quarters `financials` provides, so the
      # sweep must read what this Sunday's financials refresh stored. Gives up
      # after two hours and refreshes anyway.
      - name: Wait for the sibling's financials refresh
        if: github.event_name == 'schedule'
        working-directory: vnindex-web
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python wait_for_upstream.py financials_refresh.yml --max-wait-min 120

      # The scheduled run (and field=refresh/all) refetches detail, news/events
      # and holders for every valued ticker. Until 2026-11-01 this step only ran
      # `backfill.py holders` and `backfill.py payables`, which fetch tickers
      # still MISSING a field -- so once every ticker had one, nothing was ever
      # refreshed and detail stayed at the quarter it was first loaded with
      # (2026-Q2 while VCI already had Q3). Under vnstock's quota a full sweep
      # did not fit; through vndata it takes about half an hour.
      # A single field name still runs the targeted backfill; backfill.py stops
      # on its own when a round makes no progress.
      - name: Refresh the side-loaded blocks
        working-directory: vnindex-web
        env:
          PYTHONIOENCODING: utf-8
        run: |
          FIELD='${{ inputs.field }}'
          if [ -z "$FIELD" ] || [ "$FIELD" = "refresh" ] || [ "$FIELD" = "all" ]; then
            python -u export_detailed.py --all
          else
            python backfill.py "$FIELD"
          fi

      # Analyst targets and ratings, with the date VCI gives for each call;
      # the stock page shows "Khuyến nghị cập nhật ngày ...". Before this the
      # block was only filled where missing and went stale. ~25 minutes; a
      # failed call keeps the committed record.
      - name: Save (side-loaded blocks)
        if: ${{ !cancelled() }}
        working-directory: vnindex-web
        run: bash ci-commit-data.sh "Weekly refresh - side-loaded blocks"

      - name: Refresh analyst targets
        working-directory: vnindex-web
        env:
          PYTHONIOENCODING: utf-8
        run: python -u export_analyst.py --all

      # Corporate actions (dividends, bonus/stock issues, rights, with the
      # exchange's ex-dates) and insider deals -> the `actions` and `insiders`
      # blocks ("Quyền & cổ tức", "Giao dịch nội bộ", the screener's insider
      # column). One VCI call per ticker at 4 s apart: ~30 minutes for 403
      # tickers, longer when VCI throttles and the script backs off. A ticker
      # whose call fails keeps last week's committed blocks.
      - name: Save (analyst targets)
        if: ${{ !cancelled() }}
        working-directory: vnindex-web
        run: bash ci-commit-data.sh "Weekly refresh - analyst targets"

      - name: Refresh corporate actions and insider deals
        working-directory: vnindex-web
        continue-on-error: true
        timeout-minutes: 75
        env:
          PYTHONIOENCODING: utf-8
        run: python -u export_actions.py --all

      - name: Save (corporate actions, insiders)
        if: ${{ !cancelled() }}
        working-directory: vnindex-web
        run: bash ci-commit-data.sh "Weekly refresh - corporate actions, insiders"

      # Earnings release dates (VCI's statement feed) and the price reaction
      # around each one -> the `earnings` block ("Giá phản ứng khi ra báo cáo
      # quý"). One VCI call per ticker at 4 s apart, ~30 minutes; reads prices
      # from the database. After the financials wait, so the newest quarter is
      # in. A ticker whose call fails keeps its committed release dates.
      - name: Refresh earnings releases and reaction
        working-directory: vnindex-web
        continue-on-error: true
        timeout-minutes: 75
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python -u export_earnings.py

      - name: Save (earnings)
        if: ${{ !cancelled() }}
        working-directory: vnindex-web
        run: bash ci-commit-data.sh "Weekly refresh - earnings"

      # Each ticker's historical P/E, P/B, P/S, P/OCF, EV/EBITDA from VCI's
      # quarter-end ratios -> data/own_multiples.json, which model_valuation
      # reads for the "own history" and sector-median methods. One VCI call per
      # ticker at 2 s apart, ~15 minutes. A failed call keeps last week's figure.
      - name: Refresh historical valuation multiples
        working-directory: vnindex-web
        continue-on-error: true
        timeout-minutes: 45
        env:
          PYTHONIOENCODING: utf-8
        run: python -u export_multiples.py

      - name: Save (historical multiples)
        if: ${{ !cancelled() }}
        working-directory: vnindex-web
        run: bash ci-commit-data.sh "Weekly refresh - historical multiples"

      # Phase 10 backtest -> data/backtest.json, read by the "Kiểm định chiến
      # lược" view. ~2 minutes; reads the database only. After the financials
      # refresh above, so the newest quarter is in. A failure keeps last
      # week's committed file.
      # Off while the view is private; set repo variable RUN_BACKTEST=true to resume.
      - name: Strategy backtest
        if: ${{ vars.RUN_BACKTEST == 'true' }}
        working-directory: vnindex-web
        continue-on-error: true
        timeout-minutes: 30
        env:
          PYTHONIOENCODING: utf-8
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u export_backtest.py

      - name: Commit whatever changed
        if: ${{ !cancelled() }}
        working-directory: vnindex-web
        run: bash ci-commit-data.sh "Weekly refresh of side-loaded data"
