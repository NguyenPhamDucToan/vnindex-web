name: Build data and deploy to Cloudflare Pages

# The static site is only as fresh as data/, so a deploy is an export plus a
# publish. Runs after HOSE closes on weekdays, on every push to master, and on
# demand.
on:
  schedule:
    # 10:30 UTC = 17:30 ICT, Mon-Fri. The sibling repo's refresh.yml starts at
    # 09:03 and needs ~51 minutes for 641 tickers, so this has to wait it out:
    # at the 09:20 I first picked, the export would have read a database that
    # was still being written, and published a half-updated site every day.
    # 87 minutes of clearance covers a healthy run with real headroom.
    #
    # It sat at 12:30 from 2026-10-28 to 2026-11-01 while vnstock 5's quota
    # stretched the sibling refresh to ~75-100 minutes. That refresh now calls
    # VCI directly (~15 min of prices), so this is back at 10:30 -- and the
    # clock is no longer what keeps the two apart: GitHub starts both crons up
    # to five hours late, so the step "Wait for the sibling's price refresh"
    # below asks the Actions API whether today's refresh has finished.
    - cron: "30 10 * * 1-5"
  push:
    branches: [master]
  workflow_dispatch: {}

# One deploy at a time; a queued run should wait rather than race, but an
# in-flight deploy is not worth cancelling half-finished.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # 30 was not enough once the export started measuring 5.5 years of
    # multiples: the job was cut at exactly 30:16 inside the export step. The
    # per-ticker queries that caused it are now a single read, so this is
    # headroom rather than a fix. 300 since a scheduled run may also spend up
    # to 80 minutes waiting for the sibling's refresh.
    timeout-minutes: 300
    steps:
      # export_data.py imports config, valuation/* and models/* from the
      # sibling project and finds it at ../vnindex-valuation, so both repos
      # are checked out side by side under the workspace to recreate that
      # layout.
      - uses: actions/checkout@v5
        with:
          path: vnindex-web

      - uses: actions/checkout@v5
        with:
          repository: NguyenPhamDucToan/vnindex_valuation
          path: vnindex-valuation

      # Which day's data are we allowed to reuse? ICT, because that is the day
      # boundary the market -- and therefore the export -- actually runs on.
      - name: Today in ICT
        id: day
        run: echo "d=$(date -u -d '+7 hours' +%F)" >> "$GITHUB_OUTPUT"

      # The cache key carries the git tree hash of data/, because restoring the
      # cache writes over the checkout. A commit that adds data -- the broker
      # detail backfill did exactly this -- was silently replaced by the older
      # cached copy, and export_data.py then carried the stale side-loaded
      # blocks forward from it: SSI lost the five revenue lines its new chart
      # needs, and the chart never appeared on the published site. Keying on the
      # tree hash means any change to committed data/ misses the cache.
      - name: Tree hash of committed data/
        id: datatree
        working-directory: vnindex-web
        run: echo "h=$(git rev-parse HEAD:data | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore today's export if one exists
        id: data-cache
        uses: actions/cache/restore@v5
        with:
          path: vnindex-web/data
          restore-keys: data-${{ steps.day.outputs.d }}-${{ steps.datatree.outputs.h }}-
          key: data-${{ steps.day.outputs.d }}-${{ steps.datatree.outputs.h }}-${{ github.run_id }}

      # A CSS or JS push has no reason to spend 15 minutes re-reading 641
      # tickers out of the database. It exports only when the data could
      # actually differ: a scheduled or manual run (refreshing data is the
      # entire point of those), a push that touches the pipeline, or a day
      # with no export cached yet.
      - name: Decide whether a fresh export is needed
        id: plan
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "reason=not a push -- always export"; NEED=yes
          elif [ -z "${{ steps.data-cache.outputs.cache-matched-key }}" ]; then
            echo "reason=no export cached for ${{ steps.day.outputs.d }}"; NEED=yes
          else
            NEED=$(python3 - <<'PY'
          import json, os, re
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          files = set()
          for c in ev.get("commits", []):
              files |= set(c.get("added", []) + c.get("modified", []) + c.get("removed", []))
          # An empty list means the payload told us nothing, so assume the worst.
          # data/ counts: refresh-slow.yml commits it, and that push must export
          # rather than restore a cache that predates the new side-loaded blocks.
          pat = re.compile(r"\.py$|requirements\.txt|^\.github/workflows/|^data/")
          print("yes" if not files or any(pat.search(f) for f in files) else "no")
          PY
          )
            echo "reason=pipeline files changed? $NEED"
          fi
          echo "export=$NEED" >> "$GITHUB_OUTPUT"
          echo "### Export: $NEED (cache: ${{ steps.data-cache.outputs.cache-matched-key || 'none' }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # Only the daily schedule needs fresh prices; a push or a manual run
      # exports whatever the database holds right now. Gives up after 80
      # minutes and exports anyway, so a stuck refresh never costs the deploy.
      - name: Wait for the sibling's price refresh
        if: github.event_name == 'schedule' && steps.plan.outputs.export == 'yes'
        working-directory: vnindex-web
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python wait_for_upstream.py refresh.yml --max-wait-min 80

      # Market data now comes from the sibling's vndata package (plain
      # requests to VCI/SSI/VNDirect), so there is no vnstock to install and
      # no API key or login step.
      - name: Install dependencies
        if: steps.plan.outputs.export == 'yes'
        run: |
          pip install -r vnindex-web/requirements.txt
          pip install -r vnindex-valuation/requirements.txt

      # model_valuation.py decides every model price the site publishes; a change
      # that breaks it should stop here, not ship. Offline and against a
      # throwaway SQLite file (tests/conftest.py), so it needs no secrets.
      - name: Lint and unit tests for the valuation model
        if: steps.plan.outputs.export == 'yes'
        working-directory: vnindex-web
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 .
          python -m pytest -q tests

      - name: Export data from the database
        if: steps.plan.outputs.export == 'yes'
        working-directory: vnindex-web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        # Rewrites the fast-moving files (prices, valuations, screener, macro).
        # The slow side-loaded blocks -- detail, news_events, holders, analyst --
        # are carried forward from the committed data/ by export_data.py itself;
        # refresh-slow.yml is what updates those.
        run: python export_data.py

      # Only a fresh export is worth storing; re-saving a restored copy under a
      # new key would push 40MB into the cache on every CSS tweak.
      - name: Cache the export for the rest of the day
        if: steps.plan.outputs.export == 'yes'
        uses: actions/cache/save@v5
        with:
          path: vnindex-web/data
          key: data-${{ steps.day.outputs.d }}-${{ steps.datatree.outputs.h }}-${{ github.run_id }}

      # Reads only local files, so it is safe (and cheap) on a restored export.
      - name: Add market cap for the sector heat map
        working-directory: vnindex-web
        run: python add_mcap.py

      # Yahoo futures, ~30 s. Daily so the macro page compares the SJC gold
      # board with a world price of the same day; refresh-slow commits the
      # weekly copy. A failure keeps the committed file.
      - name: Commodity prices
        working-directory: vnindex-web
        continue-on-error: true
        timeout-minutes: 10
        run: python export_commodities.py

      - name: Sanity-check the export
        working-directory: vnindex-web
        # A deploy that publishes an empty or half-written data set is worse
        # than one that fails: the site would look fine and be wrong.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          data = Path("data")
          screener = json.loads((data / "screener.json").read_text(encoding="utf-8"))
          tickers = list((data / "ticker").glob("*.json"))
          macro = json.loads((data / "macro.json").read_text(encoding="utf-8"))
          print(f"screener rows: {len(screener)}")
          print(f"ticker files : {len(tickers)}")
          print(f"macro series : {len(macro)}")
          bad = []
          if len(screener) < 300:
              bad.append(f"screener has only {len(screener)} rows")
          if len(tickers) < 300:
              bad.append(f"only {len(tickers)} ticker files")
          if len(macro) < 30:
              bad.append(f"only {len(macro)} macro indicators")
          if not any(r.get("mcap") for r in screener):
              bad.append("no market cap on any screener row")
          if bad:
              sys.exit("Export looks wrong: " + "; ".join(bad))
          print("export looks sane")
          PY

      # The daily macro series come from the sibling's NSO job (CafeF, SJC,
      # VNDirect FX) and the monthly ones from NSO's report. A source that
      # stops answering doesn't fail anything, the chart just goes flat, so
      # list anything overdue in the run summary. A warning, not a failure:
      # the site is still worth publishing with one stale series.
      - name: Freshness of the macro series
        working-directory: vnindex-web
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from datetime import date
          macro = json.loads(open("data/macro.json", encoding="utf-8").read())
          today = date.today()
          # key -> days allowed since its latest period (monthly: period is the 1st,
          # the next one lands ~the 6th of the month after next: up to ~66 days)
          limits = {"deposit_12m_avg": 4, "sjc_gold_sell": 4, "exchange_rate": 5,
                    "cpi_yoy": 70, "iip_yoy": 70, "retail_yoy": 70, "budget_revenue": 70}
          late = []
          for k, days in limits.items():
              pts = macro.get(k) or []
              last = date.fromisoformat(str(pts[-1]["period"])[:10]) if pts else None
              age = (today - last).days if last else None
              if age is None or age > days:
                  late.append(f"- `{k}`: latest {last or 'none'} ({age if age is not None else '?'} days, limit {days})")
          print("### Macro freshness")
          print("\n".join(late) if late else "All daily and monthly macro series are current.")
          if late:
              print(f"::warning::{len(late)} macro series overdue: " + ", ".join(l.split('`')[1] for l in late))
          PY

      # Cloudflare Pages, for a URL without a username in it. Direct upload
      # rather than Cloudflare's git integration: the export already ran here,
      # and their build image would have to redo it inside a 20-minute cap that
      # a 15-minute export leaves no room under. Skipped when the secrets are
      # absent, so the workflow keeps working before Cloudflare is set up.
      # The strategy backtest is private for now (js/app.js SHOW_BACKTEST):
      # keep its page and data off the public site.
      - name: Leave the private backtest out of the upload
        working-directory: vnindex-web
        run: rm -f js/backtest.js data/backtest.json

      - name: Deploy to Cloudflare Pages
        env:
          # wrangler reads these two names specifically.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: vnindex-web
        run: npx --yes wrangler@3 pages deploy . --project-name="${{ vars.CF_PROJECT || 'vnindex-valuation' }}" --branch=main --commit-dirty=true

